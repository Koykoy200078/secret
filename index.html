<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>February 14, 2025</title>
  <meta name="author" content="@Koykoy200078">
  <meta name="description" content="A Valentine's Day card with for you.">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <div class="valentines">
      <div class="envelope"></div>
      <div class="front"></div>
      <div class="card">
        <div class="text">Happy</br> Valentine's</br> Day!</div>
        <div class="heart"></div>
        <div id="text-container">
          <div id="question">Will you be my valentine?</div>
          <div id="options">
            <button id="yes-button" onclick="selectOption('yes')">Yes</button>
            <button id="no-button" onclick="selectOption('no')">No</button>
          </div>
        </div>

         <div class="hearts">
        <div class="one"></div>
        <div class="two"></div>
        <div class="three"></div>
        <div class="four"></div>
        <div class="five"></div>
      </div>
      </div>
     
    </div>
    <div class="shadow"></div>
  </div>
  
  <div id="image-container"></div> <!-- Add this div to display the cat image -->

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
