<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Valentine's ❤️</title>
  <meta name="author" content="@Koykoy200078">
  <meta name="description" content="A Valentine's Day card with for you.">
  <link rel="stylesheet" href="styles.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    (function () {
       emailjs.init({publicKey: "u8GmhHTrd8IPP_lDg"});
    })();
  </script>
</head>

<body>
  <div class="container">
    <div class="valentines">
      <div class="envelope"></div>
      <div class="front"></div>
      <div class="card">
        <div class="text">Happy</br> Valentine's</br> Day! Love ❤️</div>
        <div class="heart" onclick="startQuestions()"></div>
        <div id="text-container">
          <div id="question">Will you be my valentine?</div>
          <div id="options">
            <button id="yes-button" onclick="handleFirstQuestion('yes')">Yes</button>
            <button id="no-button" onclick="handleFirstQuestion('no')">No</button>
          </div>
        </div>

        <div class="hearts">
        <div class="one"></div>
        <div class="two"></div>
        <div class="three"></div>
        <div class="four"></div>
        <div class="five"></div>
      </div>
      </div>
     
    </div>
    <div class="shadow"></div>
  </div>
  
  <div id="image-container"></div> 
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
